<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>BAMCO APP CENTER</title>
<style>
:root{--p:#6f2dbd;--p2:#8b5cf6;--soft:#f8f4ff;--line:#e8def8;--text:#2f2442;--muted:#8c7ba8}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{min-height:100vh;max-width:940px;margin:auto;padding:36px 20px 24px;display:flex;flex-direction:column}.logo{display:block;width:185px;max-width:55vw;height:auto;margin:0 auto 42px}.list{display:grid;gap:14px}.app{min-height:112px;border:1px solid var(--line);border-radius:24px;background:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:16px 18px;box-shadow:0 10px 28px rgba(111,45,189,.06)}.app-icon{width:68px;height:68px;border-radius:20px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center}.app-icon img{width:40px;height:40px}.copy{min-width:0}.name{margin:0;font-size:20px;line-height:1.7;font-weight:700}.state{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--p);background:var(--soft);border:1px solid var(--line);padding:5px 10px;border-radius:999px}.state.soon{color:#9a89b8}.go{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;text-decoration:none;box-shadow:0 10px 22px rgba(111,45,189,.16)}.go svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.go.disabled{background:#f4f1f8;box-shadow:none;border:1px solid var(--line)}.go.disabled svg{stroke:#b7a8cf}footer{margin-top:auto;padding-top:40px;text-align:center;color:var(--muted);font-size:12.5px;line-height:2}footer b{color:var(--text)}@media(max-width:650px){.wrap{padding-top:24px}.logo{width:150px;margin-bottom:28px}.app{grid-template-columns:auto 1fr auto;gap:12px;padding:14px}.app-icon{width:58px;height:58px}.app-icon img{width:34px;height:34px}.name{font-size:16px}.go{width:46px;height:46px}}
</style>
</head>
<body>
<main class="wrap">
<img class="logo" src="bamco-logo.png" alt="لوگوی شرکت خودروسازان بم">
<section class="list" aria-label="سامانه‌های سازمانی">
  <article class="app">
    <div class="app-icon"><img src="icons/task-management.svg" alt=""></div>
    <div class="copy"><h1 class="name">سامانه مدیریت، پایش و پیگیری امور</h1><span class="state">فعال</span></div>
    <a class="go" href="https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/" aria-label="ورود به سامانه مدیریت، پایش و پیگیری امور"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
  </article>
  <article class="app">
    <div class="app-icon"><img src="icons/vehicle-assessment.svg" alt=""></div>
    <div class="copy"><h1 class="name">سامانه ارزیابی عملکرد خودرو</h1><span class="state">فعال</span></div>
    <a class="go" href="https://nazanin-ghaemizadeh.github.io/BAMCO-VEHICLE-ASSESSMENT/" aria-label="ورود به سامانه ارزیابی عملکرد خودرو"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
  </article>
  <article class="app">
    <div class="app-icon"><img src="icons/homologation.svg" alt=""></div>
    <div class="copy"><h1 class="name">سامانه همولوگیشن</h1><span class="state soon">به زودی</span></div>
    <span class="go disabled" aria-label="به زودی"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
  </article>
</section>
<footer>توسعه یافته توسط واحد توسعه و تکوین محصول شرکت خودروسازان بم | <b>شهاب‌الدین تنهائیان</b> و <b>نازنین قائمی</b></footer>
</main>
</body>
</html>
