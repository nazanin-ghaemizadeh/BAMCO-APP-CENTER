<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>سامانه یکپارچه خودروسازان بم</title>
<style>
:root{
  --p:#6f2dbd;
  --p2:#8b5cf6;
  --p3:#a78bfa;
  --soft:#f8f4ff;
  --soft2:#fcfaff;
  --line:#e9def9;
  --text:#30223f;
  --muted:#87789f;
  --shadow:0 18px 48px rgba(111,45,189,.10);
}
*{box-sizing:border-box}
html,body{min-height:100%;}
body{
  margin:0;
  color:var(--text);
  font-family:"B Nazanin","BNazanin","B Nazanin Bold",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 8% 12%,rgba(139,92,246,.16),transparent 24%),
    radial-gradient(circle at 92% 18%,rgba(111,45,189,.10),transparent 22%),
    radial-gradient(circle at 50% 100%,rgba(167,139,250,.12),transparent 30%),
    linear-gradient(180deg,#fff 0%,#fdfbff 54%,#faf7ff 100%);
  overflow-x:hidden;
}
body:before,
body:after{
  content:"";
  position:fixed;
  z-index:-1;
  border-radius:50%;
  filter:blur(1px);
  pointer-events:none;
}
body:before{
  width:360px;height:360px;
  right:-140px;top:120px;
  border:1px solid rgba(111,45,189,.11);
  box-shadow:0 0 0 44px rgba(111,45,189,.025),0 0 0 88px rgba(111,45,189,.018);
}
body:after{
  width:300px;height:300px;
  left:-120px;bottom:50px;
  border:1px solid rgba(139,92,246,.10);
  box-shadow:0 0 0 38px rgba(139,92,246,.022),0 0 0 76px rgba(139,92,246,.014);
}
.wrap{
  min-height:100vh;
  min-height:100dvh;
  width:min(1040px,calc(100% - 32px));
  margin:auto;
  padding:32px 0 14px;
  display:flex;
  flex-direction:column;
}
.hero{
  position:relative;
  overflow:hidden;
  padding:24px 24px 26px;
  margin-bottom:22px;
  text-align:center;
  border:1px solid rgba(111,45,189,.10);
  border-radius:30px;
  background:rgba(255,255,255,.80);
  box-shadow:0 14px 38px rgba(111,45,189,.07);
  backdrop-filter:blur(14px);
}
.hero:before{
  content:"";
  position:absolute;
  inset:auto -12% -90px auto;
  width:270px;height:180px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15),rgba(139,92,246,0) 70%);
}
.logo{
  display:block;
  width:155px;
  max-width:48vw;
  height:auto;
  margin:0 auto 10px;
  position:relative;
  z-index:1;
}
.title{
  position:relative;
  z-index:1;
  margin:0;
  color:var(--p);
  font-size:30px;
  font-weight:700;
  line-height:1.75;
}
.subtitle{
  position:relative;
  z-index:1;
  margin:0;
  color:var(--muted);
  font-size:17px;
  line-height:1.7;
}
.list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.app{
  position:relative;
  overflow:hidden;
  min-height:245px;
  padding:22px;
  border:1px solid var(--line);
  border-radius:28px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.app:before{
  content:"";
  position:absolute;
  right:0;top:0;
  width:100%;height:5px;
  background:linear-gradient(90deg,var(--p3),var(--p));
  opacity:.9;
}
.app:hover{
  transform:translateY(-4px);
  border-color:#dcccfa;
  box-shadow:0 22px 56px rgba(111,45,189,.14);
}
.app-top{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}
.app-icon{
  width:72px;height:72px;
  border-radius:22px;
  background:linear-gradient(145deg,#fbf9ff,#f0e8ff);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  box-shadow:inset 0 1px 0 #fff;
}
.app-icon img{width:43px;height:43px}
.state{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 11px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--p);
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}
.state:before{
  content:"";
  width:7px;height:7px;
  border-radius:50%;
  background:var(--p2);
  box-shadow:0 0 0 4px rgba(139,92,246,.10);
}
.state.soon{color:#9987b4;background:#faf8fd}
.state.soon:before{background:#b7a7cd;box-shadow:none}
.name{
  margin:0;
  font-size:22px;
  font-weight:700;
  line-height:1.85;
  text-align:right;
}
.enter-row{
  width:100%;
  margin-top:auto;
  padding-top:22px;
  display:flex;
  justify-content:flex-end;
}
.go{
  width:54px;height:54px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--p),var(--p2));
  display:grid;
  place-items:center;
  text-decoration:none;
  box-shadow:0 12px 26px rgba(111,45,189,.20);
  transition:transform .18s ease,box-shadow .18s ease;
}
.go:hover{transform:scale(1.06);box-shadow:0 14px 30px rgba(111,45,189,.26)}
.go svg{
  width:25px;height:25px;
  fill:none;
  stroke:#fff;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.go.disabled{
  background:#f3eff8;
  box-shadow:none;
  border:1px solid var(--line);
  cursor:default;
}
.go.disabled svg{stroke:#b7a8ce}
footer{
  margin-top:auto;
  padding:18px 12px 0;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  font-weight:400;
  line-height:2;
}

/* Desktop: fit the whole composition inside a 100% browser zoom viewport. */
@media(min-width:901px){
  html,body{height:100%;}
  body{overflow-y:hidden;}
  .wrap{height:100vh;height:100dvh;min-height:0;}
}

/* Compact vertical fit for common laptop/browser viewport heights. */
@media(min-width:901px) and (max-height:680px){
  .wrap{padding:18px 0 10px;}
  .hero{padding:16px 20px 18px;margin-bottom:16px;border-radius:26px;}
  .logo{width:135px;margin-bottom:6px;}
  .title{font-size:27px;line-height:1.6;}
  .subtitle{font-size:15px;line-height:1.55;}
  .app{min-height:218px;padding:18px 20px;border-radius:25px;}
  .app-top{margin-bottom:14px;}
  .app-icon{width:64px;height:64px;border-radius:20px;}
  .app-icon img{width:39px;height:39px;}
  .name{font-size:20px;line-height:1.7;}
  .enter-row{padding-top:14px;}
  .go{width:50px;height:50px;border-radius:16px;}
  footer{padding-top:10px;font-size:13px;line-height:1.7;}
}

@media(max-width:900px){
  body{overflow-y:auto;}
  .wrap{height:auto;min-height:100vh;min-height:100dvh;}
  .list{grid-template-columns:1fr}
  .app{min-height:185px}
}
@media(max-width:650px){
  .wrap{width:min(100% - 22px,1040px);padding-top:18px}
  .hero{padding:20px 14px 22px;border-radius:24px}
  .logo{width:132px}
  .title{font-size:24px}
  .subtitle{font-size:15px}
  .app{padding:18px;border-radius:24px}
  .app-icon{width:62px;height:62px;border-radius:19px}
  .app-icon img{width:37px;height:37px}
  .name{font-size:19px}
  .state{font-size:13px}
  .go{width:49px;height:49px}
  footer{font-size:12.5px;padding-top:24px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <img class="logo" src="bamco-logo.png" alt="لوگوی شرکت خودروسازان بم">
    <h1 class="title">سامانه یکپارچه دسترسی به سامانه‌های سازمانی</h1>
    <p class="subtitle">شرکت خودروسازان بم</p>
  </header>

  <section class="list" aria-label="سامانه‌های سازمانی">
    <article class="app">
      <div class="app-top">
        <div class="app-icon"><img src="icons/task-management.svg" alt="آیکون سامانه مدیریت امور"></div>
        <span class="state">فعال</span>
      </div>
      <h2 class="name">سامانه مدیریت، پایش و پیگیری امور</h2>
      <div class="enter-row">
        <a class="go" href="https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/" aria-label="ورود به سامانه مدیریت، پایش و پیگیری امور">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </a>
      </div>
    </article>

    <article class="app">
      <div class="app-top">
        <div class="app-icon"><img src="icons/vehicle-assessment.svg" alt="آیکون سامانه ارزیابی عملکرد خودرو"></div>
        <span class="state">فعال</span>
      </div>
      <h2 class="name">سامانه ارزیابی عملکرد خودرو</h2>
      <div class="enter-row">
        <a class="go" href="https://nazanin-ghaemizadeh.github.io/BAMCO-VEHICLE-ASSESSMENT/" aria-label="ورود به سامانه ارزیابی عملکرد خودرو">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </a>
      </div>
    </article>

    <article class="app">
      <div class="app-top">
        <div class="app-icon"><img src="icons/homologation.svg" alt="آیکون سامانه همولوگیشن"></div>
        <span class="state soon">به زودی</span>
      </div>
      <h2 class="name">سامانه همولوگیشن</h2>
      <div class="enter-row">
        <span class="go disabled" aria-label="سامانه همولوگیشن به زودی فعال می‌شود">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </span>
      </div>
    </article>
  </section>

  <footer>توسعه یافته توسط واحد توسعه و تکوین محصول شرکت خودروسازان بم | شهاب‌الدین تنهائیان و نازنین قائمی</footer>
</main>
</body>
</html>
