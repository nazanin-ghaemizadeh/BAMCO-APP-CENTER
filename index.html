<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>سامانه یکپارچه دسترسی واحد مهندسی توسعه و تکوین محصول</title>
<style>
:root{--p:#6f2dbd;--p2:#8b5cf6;--p3:#a78bfa;--soft:#f8f4ff;--line:#e9def9;--text:#30223f;--muted:#87789f;--shadow:0 18px 48px rgba(111,45,189,.10)}
*{box-sizing:border-box}html,body{height:100%;min-height:100%}
body{margin:0;color:var(--text);font-family:"B Nazanin","BNazanin","B Nazanin Bold",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 8% 12%,rgba(139,92,246,.16),transparent 24%),radial-gradient(circle at 92% 18%,rgba(111,45,189,.10),transparent 22%),radial-gradient(circle at 50% 100%,rgba(167,139,250,.12),transparent 30%),linear-gradient(180deg,#fff 0%,#fdfbff 54%,#faf7ff 100%);overflow:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none}
body:before{width:360px;height:360px;right:-140px;top:120px;border:1px solid rgba(111,45,189,.11);box-shadow:0 0 0 44px rgba(111,45,189,.025),0 0 0 88px rgba(111,45,189,.018)}
body:after{width:300px;height:300px;left:-120px;bottom:50px;border:1px solid rgba(139,92,246,.10);box-shadow:0 0 0 38px rgba(139,92,246,.022),0 0 0 76px rgba(139,92,246,.014)}
.wrap{height:100vh;height:100dvh;width:calc(100% - 48px);max-width:1400px;margin:auto;padding:18px 0 12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px}
.hero{position:relative;overflow:hidden;padding:20px 24px 22px;margin:0;text-align:center;border:1px solid rgba(111,45,189,.10);border-radius:30px;background:rgba(255,255,255,.80);box-shadow:0 14px 38px rgba(111,45,189,.07);backdrop-filter:blur(14px)}
.hero:before{content:"";position:absolute;inset:auto -12% -90px auto;width:270px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.15),rgba(139,92,246,0) 70%)}
.logo{display:block;width:145px;max-width:48vw;height:auto;margin:0 auto 8px;position:relative;z-index:1}
.title{position:relative;z-index:1;margin:0;color:var(--p);font-size:29px;font-weight:700;line-height:1.65}
.subtitle{position:relative;z-index:1;margin:0;color:var(--muted);font-size:17px;line-height:1.6}
.list{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.app{position:relative;overflow:hidden;min-height:0;height:100%;padding:22px 22px 20px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.app:before{content:"";position:absolute;right:0;top:0;width:100%;height:5px;background:linear-gradient(90deg,var(--p3),var(--p));opacity:.9}
.app:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;left:-95px;bottom:-120px;background:radial-gradient(circle,rgba(139,92,246,.09),rgba(139,92,246,0) 70%);pointer-events:none}
.app:hover{transform:translateY(-4px);border-color:#dcccfa;box-shadow:0 22px 56px rgba(111,45,189,.14)}
.app-top{width:100%;display:flex;align-items:center;justify-content:flex-start;min-height:32px;margin-bottom:8px}
.state{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--p);font-size:14px;font-weight:700;white-space:nowrap}
.state:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--p2);box-shadow:0 0 0 4px rgba(139,92,246,.10)}
.state.soon{color:#9987b4;background:#faf8fd}.state.soon:before{background:#b7a7cd;box-shadow:none}
.app-icon{position:relative;flex:0 0 auto;width:158px;height:158px;margin:2px auto 14px;border-radius:38px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.98) 0 16%,transparent 17%),linear-gradient(145deg,#ffffff 0%,#f8f3ff 48%,#eee4ff 100%);border:1px solid #dfd0f7;box-shadow:0 18px 36px rgba(111,45,189,.14),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -18px 34px rgba(139,92,246,.045);isolation:isolate}
.app-icon:before,.app-icon:after{content:"";position:absolute;border-radius:50%;z-index:-1}.app-icon:before{width:116px;height:116px;background:rgba(139,92,246,.08);box-shadow:0 0 0 15px rgba(139,92,246,.035)}.app-icon:after{width:22px;height:22px;left:18px;top:18px;background:linear-gradient(135deg,var(--p3),var(--p2));opacity:.22}
.app-icon img{width:112px;height:112px;display:block;filter:drop-shadow(0 10px 16px rgba(111,45,189,.13));transform:scale(1.02)}
.name{margin:0 auto;max-width:95%;font-size:22px;font-weight:700;line-height:1.75;text-align:center}
.enter-row{width:100%;margin-top:auto;padding-top:16px;display:flex;justify-content:center;position:relative;z-index:2}
.go{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;text-decoration:none;box-shadow:0 12px 26px rgba(111,45,189,.20);transition:transform .18s ease,box-shadow .18s ease}.go:hover{transform:scale(1.06);box-shadow:0 14px 30px rgba(111,45,189,.26)}
.go svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.go.disabled{background:#f3eff8;box-shadow:none;border:1px solid var(--line);cursor:default}.go.disabled svg{stroke:#b7a8ce}
footer{padding:0 12px;text-align:center;color:var(--muted);font-size:14px;font-weight:400;line-height:1.8}
@media(min-width:901px) and (max-height:720px){.wrap{padding:12px 0 8px;gap:12px}.hero{padding:14px 20px 16px;border-radius:26px}.logo{width:125px;margin-bottom:5px}.title{font-size:25px;line-height:1.5}.subtitle{font-size:15px;line-height:1.5}.app{padding:17px 18px 16px;border-radius:25px}.app-top{margin-bottom:3px}.app-icon{width:122px;height:122px;border-radius:30px;margin-bottom:8px}.app-icon:before{width:88px;height:88px;box-shadow:0 0 0 11px rgba(139,92,246,.035)}.app-icon img{width:86px;height:86px}.name{font-size:19px;line-height:1.55}.enter-row{padding-top:8px}.go{width:46px;height:46px;border-radius:15px}footer{font-size:12.5px;line-height:1.6}}
@media(max-width:900px){body{overflow-y:auto}.wrap{height:auto;min-height:100vh;min-height:100dvh;width:min(100% - 24px,1040px);display:flex;flex-direction:column}.list{grid-template-columns:1fr}.app{min-height:280px;height:auto}}
@media(max-width:650px){.wrap{padding-top:18px}.hero{padding:20px 14px 22px;border-radius:24px}.logo{width:132px}.title{font-size:22px;line-height:1.7}.subtitle{font-size:15px}.app{padding:18px;border-radius:24px;min-height:268px}.app-icon{width:116px;height:116px;border-radius:29px;margin-bottom:10px}.app-icon:before{width:84px;height:84px;box-shadow:0 0 0 10px rgba(139,92,246,.035)}.app-icon img{width:82px;height:82px}.name{font-size:19px;line-height:1.6}.state{font-size:13px}.go{width:49px;height:49px}footer{font-size:12.5px;padding-top:8px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<img class="logo" src="bamco-logo.png" alt="لوگوی شرکت خودروسازان بم">
<h1 class="title">سامانه یکپارچه دسترسی واحد مهندسی توسعه و تکوین محصول</h1>
<p class="subtitle">شرکت خودروسازان بم</p>
</header>
<section class="list" aria-label="سامانه‌های سازمانی">
<article class="app">
<div class="app-top"><span class="state">فعال</span></div>
<div class="app-icon"><img src="icons/task-management.svg" alt="آیکون سامانه مدیریت امور"></div>
<h2 class="name">سامانه مدیریت، پایش و پیگیری امور</h2>
<div class="enter-row"><a class="go" href="https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/" aria-label="ورود به سامانه مدیریت، پایش و پیگیری امور"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></div>
</article>
<article class="app">
<div class="app-top"><span class="state">فعال</span></div>
<div class="app-icon"><img src="icons/vehicle-assessment.svg" alt="آیکون سامانه ارزیابی عملکرد خودرو"></div>
<h2 class="name">سامانه ارزیابی عملکرد خودرو</h2>
<div class="enter-row"><a class="go" href="https://nazanin-ghaemizadeh.github.io/BAMCO-VEHICLE-ASSESSMENT/" aria-label="ورود به سامانه ارزیابی عملکرد خودرو"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></div>
</article>
<article class="app">
<div class="app-top"><span class="state soon">به زودی</span></div>
<div class="app-icon"><img src="icons/homologation.svg" alt="آیکون سامانه همولوگیشن"></div>
<h2 class="name">سامانه همولوگیشن</h2>
<div class="enter-row"><span class="go disabled" aria-label="سامانه همولوگیشن به زودی فعال می‌شود"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span></div>
</article>
</section>
<footer>توسعه یافته توسط واحد توسعه و تکوین محصول شرکت خودروسازان بم | شهاب‌الدین تنهائیان و نازنین قائمی</footer>
</main>
</body>
</html>
